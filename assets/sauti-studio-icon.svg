<!-- Sauti Studio, one of The Editors' family: the dark tile, the white editing cursor and the amber selection are the
     family's; the sound bars are Sauti Studio's. The PNGs are made from this by scripts/make-icon.mjs. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs>
  <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
